[project]
name = "agri-price"
version = "0.1.0"
description = "Multi-Source(KAMIS·기상·뉴스) 결합 농산물 가격 변동 요인 분석 및 예측 시스템"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "requests>=2.31",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "shap>=0.45",
    "statsmodels>=0.14",
    "plotly>=5.20",
    "streamlit>=1.37",
    "anthropic>=0.34",
    "folium>=0.16",
    "streamlit-folium>=0.20",
    "supabase>=2.4",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
extra = ["prophet>=1.1", "duckdb>=1.0", "topojson>=1.7"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.ruff]
line-length = 88

# 이 프로젝트는 설치 가능한 패키지가 아니라 src/ 아래 스크립트를
# sys.path 로 직접 불러 쓰는 구조입니다(agri_price 패키지 폴더가 없음).
# Streamlit Cloud 가 pyproject.toml 을 보고 Poetry 로 자기 자신을
# 설치하려다 "No file/folder found for package agri-price" 로 실패해서
# 꺼둡니다. 의존성 설치는 requirements.txt 를 씁니다.
[tool.poetry]
package-mode = false
